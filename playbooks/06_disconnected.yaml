# This playbook applies disconnected configuration to each SNO cluster
---
- name: Disconnected configuration for each SNO cluster
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - ../myvars/external_vars.yaml
  tasks:
    - name: Disable default OperatorHub sources
      ansible.builtin.shell: |
        set -e -o pipefail
        export KUBECONFIG="{{ myworkdir }}/{{ item }}/ocp/auth/kubeconfig"
        {{ myworkdir }}/oc patch OperatorHub cluster --type json \
          -p '[{"op": "add", "path": "/spec/disableAllDefaultSources", "value": true}]'
      with_items: "{{ snos }}"
      when: disconnected
      register: operatorhub_patch
      changed_when: "'no change' not in operatorhub_patch.stdout"

    - name: Apply ImageDigestMirrorSets
      ansible.builtin.shell: |
        set -e -o pipefail
        export KUBECONFIG="{{ myworkdir }}/{{ item }}/ocp/auth/kubeconfig"
        for f in {{ myworkdir }}/disconnected/idms-oc-mirror*.yaml; do
          {{ myworkdir }}/oc apply -f "$f"
        done
      with_items: "{{ snos }}"
      when: disconnected
      register: idms_apply
      until: idms_apply is not failed
      retries: 10
      delay: 10

    - name: Check for ImageTagMirrorSet
      ansible.builtin.stat:
        path: "{{ myworkdir }}/disconnected/itms-oc-mirror.yaml"
      register: itms_file
      when: disconnected

    - name: Apply ImageTagMirrorSet
      ansible.builtin.shell: |
        set -e -o pipefail
        export KUBECONFIG="{{ myworkdir }}/{{ item }}/ocp/auth/kubeconfig"
        {{ myworkdir }}/oc apply -f {{ myworkdir }}/disconnected/itms-oc-mirror.yaml
      with_items: "{{ snos }}"
      when: disconnected and itms_file.stat.exists
      register: itms_apply
      until: itms_apply is not failed
      retries: 10
      delay: 10

    - name: Verify CatalogSource manifests exist
      ansible.builtin.shell: |
        ls {{ myworkdir }}/disconnected/cs-{{ item[1] }}*.yaml
      loop: "{{ snos | product(catalogs) | list }}"
      when: disconnected
      changed_when: false

    - name: Apply CatalogSources
      ansible.builtin.shell: |
        set -e -o pipefail
        export KUBECONFIG="{{ myworkdir }}/{{ item[0] }}/ocp/auth/kubeconfig"
        {{ myworkdir }}/oc apply -f {{ myworkdir }}/disconnected/cs-{{ item[1] }}*.yaml
      loop: "{{ snos | product(catalogs) | list }}"
      loop_control:
        label: "{{ item[0] }} / {{ item[1] }}"
      when: disconnected
      register: catalogsources
      until: catalogsources is not failed
      retries: 10
      delay: 10

    - name: Wait for CatalogSources to be ready
      ansible.builtin.shell: |
        set -e -o pipefail
        export KUBECONFIG="{{ myworkdir }}/{{ item }}/ocp/auth/kubeconfig"
        NOTREADY=0
        for cs in $({{ myworkdir }}/oc get catalogsource -n openshift-marketplace -o name); do
          STATE=$({{ myworkdir }}/oc get $cs -n openshift-marketplace \
            -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo MISSING)
          if [ "$STATE" != "READY" ]; then
            echo "$cs is ${STATE:-EMPTY}"
            NOTREADY=1
          fi
        done
        [ "$NOTREADY" -eq 0 ] && echo "All CatalogSources ready"
        exit $NOTREADY
      with_items: "{{ snos }}"
      when: disconnected
      register: catalogsource_ready
      until: catalogsource_ready is not failed
      retries: 30
      delay: 10
      changed_when: false
